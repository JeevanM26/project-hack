<!DOCTYPE html>
<html>
<head>
<title>Open Notepad</title>
<style>
body {
  font-family: sans-serif;
}
#notepad {
  width: 80%;
  height: 400px;
  border: 1px solid #ccc;
  padding: 10px;
  resize: vertical;
}
</style>
</head>
<body>
<h1>Open Notepad</h1>
<textarea id="notepad"></textarea>
<script>
const notepad = document.getElementById('notepad');
notepad.value = localStorage.getItem('note') || '';
</script>
</body>
</html>
